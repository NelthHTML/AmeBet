name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Droits demandés par l'action de déploiement Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; on laisse finir celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Sans le secret FIREBASE_CONFIG, le firebase-config.js du dépôt est
      # publié tel quel. Avec, il est régénéré à partir du secret.
      - name: Injecter la config Firebase
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: node scripts/write-config.mjs

      # Empêche GitHub Pages de passer le site dans Jekyll, qui ignorerait
      # les dossiers commençant par un underscore.
      - name: Marquer le site comme statique
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
